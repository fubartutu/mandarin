# Mandarin: build the Docker image from the `household` branch and publish it to
# ghcr.io/<owner>/<repo>. Action versions are pinned to the same SHAs upstream uses
# in preview.yml, so Renovate-style updates come in with upstream merges.
name: Household Docker image

on:
  push:
    branches:
      - household
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: household-docker
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, so `git describe` works
      - name: Version
        id: version
        # e.g. v2.7.0-171-ge2e7d627b: the upstream release we're based on + our commit
        run: echo "describe=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          # :household and :latest track the branch; :sha-<long> pins an exact build for rollbacks
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Mandarin
            org.opencontainers.image.description=Household tasks, shopping and recipes (soft fork of Vikunja)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
