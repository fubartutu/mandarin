# Mandarin: build the recipe scraper image from household-scraper/ and publish
# it to ghcr.io/<owner>/mandarin-scraper. Action versions match
# household-docker.yml.
name: Household scraper image

on:
  push:
    branches:
      - household
    paths:
      - household-scraper/**
      - .github/workflows/household-scraper-docker.yml
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: household-scraper-docker
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: household-scraper
          load: true
          tags: mandarin-scraper:test
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper
      - name: Unit tests (inside the image)
        # The tests aren't copied into the image, so mount them.
        run: |
          docker run --rm --user root -v "$PWD/household-scraper:/src" -w /src mandarin-scraper:test \
            sh -c "pip install -q -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider"
      - name: Smoke test
        run: |
          docker run -d --name scraper -p 8000:8000 mandarin-scraper:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/parse -H 'Content-Type: application/json' \
            -d '{"lines":["2 cups (250g) plain flour, sifted"]}' | tee /dev/stderr | grep -q '"name":"plain flour"'
          docker rm -f scraper
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mandarin-scraper
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Mandarin recipe scraper
            org.opencontainers.image.description=Reads recipes from web pages for Mandarin
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: household-scraper
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=scraper
